[platformio]
default_envs = teensy41
src_dir = src
include_dir = include

[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino
board_build.f_cpu = 600000000L
monitor_speed = 115200
lib_deps = 
    olikraus/U8g2@2.36.18
    andrenepomuceno/CriticalTaskScheduler@1.0.7

[env:teensy41_diagnostics]
extends = env:teensy41
build_flags = -DMULTIFX_DIAGNOSTICS=1
